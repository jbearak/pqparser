[package]
name = "pqparser"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false
description = "The wasm module of pqparser: arrow-rs's Parquet reader, with a thin C ABI for its TypeScript API"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Read only; brotli and the Hadoop framing of LZ4 are left out on purpose.
parquet = { version = "=60.1.0", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2-rust_backend"] }
arrow-array = { version = "=60.1.0", default-features = false }
arrow-schema = "=60.1.0"
arrow-ipc = { version = "=60.1.0", default-features = false }
base64 = "0.23"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
