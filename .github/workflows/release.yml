name: release

# Pushing a tag vX.Y.Z builds the package from that commit, tests it, and
# attaches the tarball `npm pack` makes, with its SHA-256, to a GitHub
# release of the tag. Nothing is published to npm.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two runs for one tag never overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # zstd's C code: Ubuntu's clang targets wasm32.
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
      # The Rust each release is built with, named in its notes.
      RUST_VERSION: "1.99.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$GITHUB_REF_NAME is not a release tag vX.Y.Z." >&2
            exit 1
          fi
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main." >&2
            exit 1
          fi
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - name: Install clang and llvm
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sh scripts/build-wasm.sh
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack
        run: |
          mkdir release
          tarball="$(npm pack --silent --pack-destination release)"
          (cd release && sha256sum "$tarball" > "$tarball.sha256")
          {
            echo "Built and tested by the release workflow from $GITHUB_SHA."
            echo
            echo '```'
            cat "release/$tarball.sha256"
            echo '```'
            echo
            echo "- $(rustc --version)"
            echo "- $(clang --version | head -n 1)"
            echo "- Node $(node --version)"
            echo
            echo "Install with npm from the tarball's URL, which records the tarball's sha512 in package-lock.json:"
            echo
            echo '```'
            echo "npm install https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$tarball"
            echo '```'
          } > notes.md
          mv notes.md release/
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Only this job can write, and it runs no code from the repository.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Release
        working-directory: release
        run: |
          tag="$GITHUB_REF_NAME"
          # The commit the tag names now, which must be the one built.
          check_tag() {
            sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq .sha)"
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "$tag now names $sha, not $GITHUB_SHA, which was built." >&2
              return 1
            fi
          }
          check_tag
          # A release, draft or not, already made for this tag is never
          # replaced or added to.
          if [ "$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id" | wc -l)" -ne 0 ]; then
            echo "A release of $tag already exists; delete it if it is a failed run's draft." >&2
            exit 1
          fi
          # A draft until every file is attached, so a failed upload leaves
          # no release that looks finished. Everything after uses the
          # draft's id, never its tag, which other drafts could share.
          id="$(gh api "repos/$GH_REPO/releases" -f tag_name="$tag" -f name="$tag" \
            -F body=@notes.md -F draft=true --jq .id)"
          tarball="$(ls pqparser-*.tgz)"
          for f in "$tarball" "$tarball.sha256"; do
            gh api "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$f" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq .name
          done
          attached="$(gh api "repos/$GH_REPO/releases/$id/assets" --jq '.[].name' | sort | tr '\n' ' ')"
          if [ "$attached" != "$tarball $tarball.sha256 " ]; then
            echo "The draft has $attached attached, not $tarball and its .sha256." >&2
            exit 1
          fi
          check_tag
          gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false --jq .html_url
          # Publishing binds the release to the tag as it is now; if the tag
          # moved in the moment since the check, take the release down.
          if ! check_tag; then
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
            exit 1
          fi
